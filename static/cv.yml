cv:
  name: Sebian Van de Spiegle
  location: België
  email: sebian.vandespiegle@student.odisee.be
  website: https://sebian-lab.github.io
  social_networks:
    - network: GitHub
      username: sebian-lab
    - network: LinkedIn
      username: sebian
  sections:
    profiel:
      - 'Gedreven student **Toegepaste Informatica (Odisee Brussel)** met praktijkkennis in **DevOps, DevSecOps, Cloud Infrastructure en Software Engineering**. Ervaren in het ontwerpen van end-to-end beveiligde architecturen: van native Android apps en performante FastAPI microservices tot geautomatiseerde CI/CD-pipelines, observability, 24/7 homelab serverbeheer (30+ Docker containers) en een dedicated 9-GPU distributed LLM cluster. Zoekt een **DevOps / Cloud / Cybersecurity stage**.'
    technische_vaardigheden:
      - label: Cloud, Containers & Compute
        details: Microsoft Azure (AKS, VM, VNet, NSG, IaC ARM), Docker, Docker Compose, Kubernetes, VMware ESXi 8.0, 9-GPU Cluster (50+ GB VRAM)
      - label: DevOps, CI/CD & Observability
        details: GitHub Actions (automated build, staging promotion & E2E verification), Bandit (SAST), Trivy (Vulnerability Scanning), Nginx, Traefik
      - label: Software & Data
        details: Python (FastAPI, SQLAlchemy, Pydantic), Kotlin (Android SDK, Jetpack Compose, MVVM), Bash, PowerShell, PostgreSQL, Redis, REST APIs
      - label: Systeem- & Netwerkbeheer
        details: Linux (Debian 12, Ubuntu), Windows Server 2022 (Active Directory / AD DS, DNS), Tailscale Zero-Trust Mesh VPN, Network Segmentation
    projecten:
      - name: '[AlphaTracer Financial API & DevSecOps](https://github.com/sebian-lab/alphatracer-financial-api)'
        start_date: 2024-01
        end_date: present
        summary: Performante Fintech REST API gateway met complete DevSecOps pipeline en observability
        highlights:
          - 'Asynchrone REST API met **FastAPI** en **PostgreSQL**, gekoppeld aan beursdata, JWT-authenticatie en rate limiting.'
          - 'Geautomatiseerde **DevSecOps pipeline** met **Bandit** (SAST), **Trivy** vulnerability scans en gestroomlijnde observability.'
          - 'End-to-end deployment pipeline met geautomatiseerde image tagging, staging promotion en integratietest-verificatie (`test_deployment_to_running`).'
          - 'Multi-service deployment via **Docker Compose** met Nginx reverse proxy, PostgreSQL persistence en Redis caching.'
      - name: '[AlphaTracer Mobile](https://github.com/sebian-lab/alphatracer-mobile)'
        start_date: 2024-01
        end_date: present
        summary: Native Android applicatie voor portfoliobeheer en slimme koersnotificaties
        highlights:
          - 'Gebouwd in **Kotlin** met **Jetpack Compose** volgens **MVVM-architectuur** met een responsieve dark-theme UI.'
          - 'Netwerklaag met **Retrofit + OkHttp** en een custom `AuthInterceptor` voor automatische JWT refresh token-rotatie.'
          - 'Achtergrondmonitoring via **Android WorkManager** voor koersdaling-notificaties; beveiligd met **Biometrics API** en **ProGuard**.'
      - name: '[Productie Homelab & 9-GPU LLM Cluster](https://sebian-lab.github.io/projects/homelab/)'
        start_date: 2023-09
        end_date: present
        summary: Zelfstandig beheerde Debian 12 server (30+ containers) en dedicated 9-GPU AI cluster
        highlights:
          - 'Beheer van **30+ actieve containers** (PostgreSQL, Immich ML, LibreChat) en een **9-GPU inference cluster (50+ GB VRAM, llama.cpp)**.'
          - 'Beveiligd via een **Tailscale Zero-Trust mesh netwerk (20 nodes)** met subnet routers, exit nodes en interne monitoring (**PortTracker**).'
      - name: '[Cloud & Virtualisatie Labs (Azure & VMware)](https://sebian-lab.github.io/projects/infrastructure/)'
        start_date: 2023-09
        end_date: present
        summary: Enterprise infrastructuurimplementaties op Microsoft Azure en VMware ESXi
        highlights:
          - 'Uitrol van **Azure Kubernetes Service (AKS)**, gesegmenteerde VNets/NSGs en **ARM Templates (IaC)**.'
          - 'Configuratie van **VMware ESXi 8.0** met vSwitch netwerken en **Windows Server 2022** Domain Controller (AD DS).'
    opleiding:
      - institution: Odisee Hogeschool Brussel
        area: Toegepaste Informatica (BSc)
        degree: Bachelor
        start_date: 2023-09
        end_date: present
        location: Brussel, België
        highlights:
          - 'Specialisatie: Software Engineering, Cloud Architecture, Virtualisatie, Computer- & Netwerkbeveiliging.'
    talen:
      - label: Talenkennis
        details: 'Nederlands (Moedertaal), Engels (Vloeiend / Professioneel werkniveau), Frans (Praktische basis)'
