        details: '[ISC2 Candidate](https://www.credly.com/badges/182b7df3-0eed-480b-81dd-3966bd800728) (ISC2, apr 2026 – apr 2027), EF SET English Certificate 75/100 (C2 Proficient – online zelf getest / zonder externe publieke verificatielink)'
