      - label: Systeem- & Netwerkbeheer
        details: Linux (Debian 12, Ubuntu), Windows Server 2022 (Active Directory / AD DS, DNS), Tailscale Zero-Trust Mesh VPN, Network Segmentation
    zelfstandige_projecten:
      - name: '[AlphaTracer Financial API & Platform](https://github.com/sebian-lab/alphatracer-financial-api)'
        start_date: 2024-01
        end_date: present
        summary: Zelfstandig praktijkproject (Hobby) – Performante Fintech REST API met CI/CD, security & observability
        highlights:
          - 'Asynchrone REST API met **FastAPI** en **PostgreSQL**, gekoppeld aan beursdata, JWT-authenticatie en rate limiting.'
          - 'Geautomatiseerde **CI/CD-pipeline** met **Bandit** (SAST), **Trivy** vulnerability scans, **Vault** secrets en **Prometheus/Grafana** metrics.'
          - 'Multi-service deployment via **Docker Compose** en **Kubernetes (K3s)** met Nginx reverse proxy en E2E testautomatisering.'
      - name: '[AlphaTracer Mobile](https://github.com/sebian-lab/alphatracer-mobile)'
        start_date: 2024-01
        end_date: present
