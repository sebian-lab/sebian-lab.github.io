        highlights:
          - 'Gebouwd in **Kotlin** met **Jetpack Compose** volgens **MVVM-architectuur** met een responsieve dark-theme UI.'
          - 'Netwerklaag via **Retrofit + OkHttp** met custom `AuthInterceptor` voor automatische JWT refresh token-rotatie.'
          - 'Achtergrondmonitoring via **WorkManager** voor koersdaling-alerts; beveiligd met **Biometrics API** en **ProGuard**.'
      - name: '[Productie Homelab & 9-GPU LLM Cluster](https://sebian-lab.github.io/projects/homelab/)'
        start_date: 2023-09
        end_date: present
        summary: Zelfstandige infrastructuur (Hobby) – 24/7 Debian 12 server (30+ containers) en dedicated 9-GPU AI cluster
        highlights:
          - 'Beheer van **30+ actieve Docker containers** (PostgreSQL, Immich ML, LibreChat) en een **9-GPU inference cluster (50+ GB VRAM, llama.cpp)**.'
          - 'Beveiligd via een **Tailscale Zero-Trust mesh netwerk (20 nodes)** met subnet routers, exit nodes en monitoring (**PortTracker**).'
    academische_projecten:
      - name: '[Cloud & Virtualisatie Labs (Azure & VMware)](https://sebian-lab.github.io/projects/infrastructure/)'
