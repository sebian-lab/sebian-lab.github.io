      - institution: HOGENT
        area: Toegepaste Informatica
        start_date: 2023-09
        end_date: 2026-01
        location: Gent, België
        highlights:
          - 'Basis- en gevorderde Software Engineering, Object-Georiënteerd Programmeren, Databanken en Algoritmen.'
